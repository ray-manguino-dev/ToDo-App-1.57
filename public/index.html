<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo App 1.57</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ ToDo App 1.57</h1>
            <p class="subtitle">Get things done, one task at a time</p>
        </header>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="200">
            <button id="addBtn" class="btn-primary">Add Task</button>
        </div>

        <div id="taskList" class="task-list"></div>

        <div id="emptyState" class="empty-state">
            <span class="empty-icon">📝</span>
            <p>No tasks yet. Add one above!</p>
        </div>

        <div class="footer">
            <span id="taskCount">0 tasks</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
